# Workshop releases, one per game: push a tag "warsztat-ea2-v0.3.0" (or "warsztat-ea1-v0.1.0") and GitHub
# builds that game's workshop ("EA2 Warsztat.exe", "EA1 Warsztat.exe") and attaches it to a release.
# Old tags "warsztat-v…" mean EA2. Translators put the file into their copy of the translation repository.
name: Warsztat

on:
  push:
    tags: ["warsztat-v*", "warsztat-*-v*"]
  workflow_dispatch:
    inputs:
      game:
        description: "Gra (ea1 albo ea2)"
        required: true
        default: "ea2"

permissions:
  contents: write

jobs:
  build:
    # vars.RUNNER = "ea2-pc" sends the job to the own runner; unset = GitHub's machines
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      # the own runner (vars.RUNNER) already has Rust; these two are for GitHub's machines
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !vars.RUNNER }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !vars.RUNNER }}
      - name: Która gra
        id: game
        shell: powershell
        run: |
          $ref = "${{ github.ref_name }}"
          $game = "${{ inputs.game }}"
          if (-not $game) { if ($ref -match '^warsztat-(ea\d+)-v') { $game = $Matches[1] } else { $game = 'ea2' } }
          $label = $game.ToUpper()
          "game=$game" >> $env:GITHUB_OUTPUT
          "exe=$label Warsztat.exe" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
      - name: Budowa warsztatu
        run: cargo build --release -p warsztat-${{ steps.game.outputs.game }}
      - name: Plik
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "target/release/warsztat-${{ steps.game.outputs.game }}.exe" "out/${{ steps.game.outputs.exe }}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Warsztat ${{ steps.game.outputs.label }} – ${{ github.ref_name }}
          files: out/${{ steps.game.outputs.exe }}
          body: |
            Warsztat polskiego tłumaczenia Escape Academy (${{ steps.game.outputs.label }}).
            Włóż „${{ steps.game.outputs.exe }}” do swojego klonu repozytorium tłumaczenia tej gry i uruchom.
            Przy pierwszym uruchomieniu warsztat sam wyciągnie teksty z Twojej kopii gry.
