[package]
name = "instalator"
version = "0.1.0"
edition = "2021"
description = "Instalator polskiej wersji Escape Academy 2"

[[bin]]
name = "ea2-spolszczenie"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
instalator-base = { path = "../instalator-base" }
# direct dependency so the dialog plugin permissions resolve for this app
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order"] }
ea2 = { path = "../ea2" }
anyhow = "1"
