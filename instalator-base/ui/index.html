<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Spolszczenie</title>
<!-- Shared installer window. The game's look comes from info().theme: it sets these variables and may add
     its own rules (header, logo, buttons). Defaults below are a plain dark theme. -->
<style>
  :root {
    --bg:#1b1b1f; --panel:#26262c; --line:#000; --text:#eee; --muted:#aaa; --faint:#777;
    --accent:#d04a3f; --accent-text:#fff; --button:#eee; --button-text:#111; --hover:#ffd54a; --hover-text:#111;
    --ok:#5fcfb7; --bad:#ff6b6b; --warn:#ffd54a; --bar:#ffd54a; --r:8px; --shadow:0 3px 0 #000;
    --font-text:"Segoe UI", sans-serif; --font-display:Georgia, serif; --font-mono:Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:600 14px/1.45 var(--font-text); overflow:hidden; }
  header { height:56px; display:flex; align-items:center; gap:10px; padding:0 8px 0 16px; background:var(--panel); border-bottom:4px solid var(--line); }
  header .sub { color:var(--muted); font-size:12px; margin-left:4px; }
  .win { margin-left:auto; display:flex; gap:4px; }
  .win button { width:34px; height:30px; padding:0; border:0; border-radius:6px; background:var(--line); color:var(--text); box-shadow:none; font-size:16px; }
  .win button:hover { background:var(--hover); color:var(--hover-text); }
  main { padding:18px 20px; display:flex; flex-direction:column; gap:14px; height:calc(100% - 56px); overflow:auto; }
  .card { background:var(--panel); border:3px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:14px 16px; }
  h2 { margin:0 0 8px; font:900 18px/1.2 var(--font-display); color:var(--hover); }
  p { margin:6px 0; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; }
  input { flex:1; min-width:0; height:36px; padding:0 10px; background:var(--bg); color:var(--text); border:3px solid var(--line); border-radius:var(--r); font:inherit; }
  button { height:36px; padding:0 14px; background:var(--button); color:var(--button-text); border:3px solid var(--line); border-radius:var(--r); font:800 13px/1 var(--font-text); cursor:pointer; box-shadow:var(--shadow); }
  button:hover { background:var(--hover); color:var(--hover-text); }
  button:active { transform:translateY(2px); box-shadow:none; }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  button.big { height:46px; padding:0 22px; font:900 17px/1 var(--font-display); background:var(--accent); color:var(--accent-text); }
  .games { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .games button { height:28px; box-shadow:none; font-size:12px; }
  .state { font-weight:800; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .bar { height:14px; background:var(--bg); border:3px solid var(--line); border-radius:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--bar); transition:width .4s; }
  pre { margin:8px 0 0; max-height:140px; overflow:auto; background:var(--line); color:var(--muted); padding:8px 10px; border-radius:6px; font:12px/1.4 var(--font-mono); white-space:pre-wrap; }
  .hidden { display:none !important; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  small { color:var(--faint); }
</style>
<style id="theme"></style>
</head>
<body>
<header data-tauri-drag-region>
  <span id="logo" data-tauri-drag-region></span><span class="sub" id="sub" data-tauri-drag-region></span>
  <div class="win"><button id="w-min" title="Minimalizuj">–</button><button id="w-close" title="Zamknij">×</button></div>
</header>
<main>
  <div class="card">
    <h2>Folder gry</h2>
    <div class="row"><input id="path" spellcheck="false"><button id="pick">Wybierz…</button></div>
    <div class="games" id="games"></div>
    <p class="state" id="state">Szukam gry…</p>
    <div id="perm" class="hidden">
      <p>Aplikacja Xbox blokuje zmiany w folderze gry. Kliknij, a Windows zapyta o zgodę administratora i pozwoli Twojemu kontu zmieniać pliki tej gry.</p>
      <button id="grant">Pozwól na zmiany w folderze gry</button>
    </div>
  </div>
  <div class="card">
    <h2>Spolszczenie</h2>
    <p id="ver"></p>
    <div class="actions">
      <button class="big" id="install" disabled>Zainstaluj</button>
      <button id="uninstall" disabled>Przywróć wersję oryginalną</button>
      <button id="launch">Uruchom grę</button>
    </div>
    <p><small><span id="note"></span> Kopie oryginalnych plików trafią do <span id="backup"></span>.</small></p>
  </div>
  <div class="card hidden" id="job">
    <h2 id="job-title">Instaluję…</h2>
    <p id="job-stage">Start…</p>
    <div class="bar"><i id="job-bar"></i></div>
    <pre id="job-log"></pre>
  </div>
</main>
<script>
const T = window.__TAURI__, call = (c, a) => T.core.invoke(c, a);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let busy = false;

async function refresh() {
  const p = $("path").value.trim();
  $("perm").classList.add("hidden");
  if (!p) { $("state").textContent = "Wskaż folder gry."; $("state").className = "state warn"; return setButtons(false, false); }
  const s = await call("status", { path: p });
  if (!s.valid) { $("state").textContent = "To nie jest folder tej gry."; $("state").className = "state bad"; return setButtons(false, false); }
  if (s.path !== p) $("path").value = s.path;
  if (!s.writable) $("perm").classList.remove("hidden");
  $("state").textContent = s.running ? "Gra jest uruchomiona – zamknij ją przed instalacją."
    : s.installed ? "Polska wersja jest zainstalowana." : "Gra znaleziona, spolszczenie nie jest zainstalowane.";
  $("state").className = "state " + (s.running ? "warn" : s.installed ? "ok" : "");
  $("install").textContent = s.installed ? "Zainstaluj ponownie" : "Zainstaluj";
  setButtons(s.writable && !s.running, s.installed && s.writable && !s.running);
}
function setButtons(inst, uninst) { $("install").disabled = busy || !inst; $("uninstall").disabled = busy || !uninst; }

async function run(cmd) {
  busy = true; setButtons(false, false);
  $("job").classList.remove("hidden");
  $("job-title").textContent = cmd === "install" ? "Instaluję polską wersję…" : "Przywracam wersję oryginalną…";
  $("job-title").className = ""; $("job-log").textContent = ""; $("job-bar").style.width = "3%";
  try { await call(cmd, { path: $("path").value.trim() }); } catch (e) { $("job-stage").textContent = String(e); busy = false; return refresh(); }
  const t0 = Date.now();
  const tick = async () => {
    const j = await call("progress");
    const m = (j.stage || "").match(/^\[(\d+)\/(\d+)\]\s*(.*)/);
    if (m) { $("job-stage").textContent = `Etap ${m[1]} z ${m[2]}: ${m[3]}`; $("job-bar").style.width = `${((+m[1] - 0.5) / +m[2]) * 100}%`; }
    $("job-log").textContent = j.log.join("\n"); $("job-log").scrollTop = 1e9;
    if (j.running) return setTimeout(tick, 500);
    busy = false;
    $("job-bar").style.width = "100%";
    const secs = Math.round((Date.now() - t0) / 1000);
    if (j.ok) {
      $("job-title").textContent = cmd === "install" ? `Gotowe! (${secs} s)` : "Przywrócono wersję oryginalną.";
      $("job-title").className = "ok";
      $("job-stage").innerHTML = cmd === "install" ? (window.NOTE || "Uruchom grę.") : "Gra jest znowu w oryginalnej wersji.";
    } else {
      $("job-title").textContent = "Nie udało się"; $("job-title").className = "bad";
      $("job-stage").textContent = (j.log.filter((l) => l.startsWith("Błąd")).pop() || "Szczegóły poniżej.").replace(/^Błąd:\s*/, "");
    }
    refresh();
  };
  tick();
}

$("install").onclick = () => run("install");
$("uninstall").onclick = () => run("uninstall");
$("launch").onclick = () => call("launch").catch((e) => alert(e));
$("grant").onclick = async () => { try { await call("grant", { path: $("path").value.trim() }); } catch (e) { alert(e); } refresh(); };
$("pick").onclick = async () => { const d = await T.dialog.open({ directory: true, title: "Wskaż folder gry" }); if (d) { $("path").value = d; refresh(); } };
$("path").addEventListener("change", refresh);
$("w-min").onclick = () => T.window.getCurrentWindow().minimize();
$("w-close").onclick = () => T.window.getCurrentWindow().close();

(async () => {
  const i = await call("info");
  $("theme").textContent = i.theme;
  $("logo").innerHTML = i.logo;
  document.title = `${i.game} – spolszczenie`;
  $("sub").textContent = `nieoficjalne spolszczenie ${i.game}`;
  $("ver").textContent = `Wersja tłumaczenia: ${i.version} · ${i.count} przetłumaczonych tekstów`;
  $("note").innerHTML = i.note; window.NOTE = i.note;
  $("backup").textContent = i.backup;
  $("games").innerHTML = i.games.length > 1 ? i.games.map((g) => `<button data-p="${esc(g.path)}">${esc(g.kind)}: ${esc(g.path)}</button>`).join("") : "";
  $("games").querySelectorAll("button").forEach((b) => b.onclick = () => { $("path").value = b.dataset.p; refresh(); });
  if (i.games.length) $("path").value = i.games[0].path;
  else { $("state").textContent = "Nie znalazłem gry. Wskaż jej folder przyciskiem „Wybierz…”."; $("state").className = "state warn"; }
  refresh();
  setInterval(() => { if (!busy) refresh(); }, 5000);
})();
</script>
</body>
</html>
