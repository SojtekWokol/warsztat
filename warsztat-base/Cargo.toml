[package]
name = "warsztat-base"
version = "0.1.0"
edition = "2021"
description = "Shared translation workshop core: store, pages API, checks, glossary, memory, Bielik, corrections, snapshots"

[lib]
name = "warsztat"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
