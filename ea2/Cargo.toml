[package]
name = "ea2"
version = "0.1.0"
edition = "2021"
description = "Escape Academy 2 Polish patch: extraction and patching"

[dependencies]
unity = { path = "../unity" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crc32fast = "1"
ttf-parser = "0.25"
ab_glyph_rasterizer = "0.1"
sha2 = "0.10"
regex = "1"
warsztat-base = { path = "../warsztat-base" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texture2ddecoder = "0.1"
